# =============================================================================
# FSFramework nginx deny sample
# -----------------------------------------------------------------------------
# This is a SAMPLE, not an active configuration. Copy the directives below into
# the `server { ... }` block of your production nginx site config.
#
# Why this exists: the repository ships .htaccess rules that protect operator
# scripts and sensitive directories. nginx ignores .htaccess, so a deployment
# on nginx (e.g. ddev `webserver_type: nginx-fpm`) exposes those paths. The PHP
# operator scripts now carry an in-code CLI/loopback guard; config.php cannot
# (it is included by the application), so it MUST be denied here.
#
# PLACEMENT IS CRITICAL
#   The `location ~ ^/plugins/.+\.php$` deny must appear BEFORE the generic
#   `location ~ \.php$` handler. nginx evaluates regex locations in order and
#   stops at the first match, so a deny placed after the PHP handler never runs.
# =============================================================================

# --- Operator / maintenance scripts ------------------------------------------
# 404 (not 403) keeps the response identical to the in-code guard and avoids
# disclosing that the file exists.
location = /config.php                { return 404; }
location = /cron.php                  { return 404; }
location = /debug_loader.php          { return 404; }
location = /visual_flow_demo.php      { return 404; }
location = /emergency_admin_reset.php { return 404; }
location = /reset_admin_password.php  { return 404; }

# --- Sensitive directories ---------------------------------------------------
# `^~` prefix locations take precedence over regex locations, so these hold
# even if this block ends up included after the PHP handler.
location ^~ /base/       { deny all; }
location ^~ /model/      { deny all; }
location ^~ /src/        { deny all; }
location ^~ /controller/ { deny all; }
location ^~ /scripts/    { deny all; }
location ^~ /tests/      { deny all; }
location ^~ /vendor/     { deny all; }
location ^~ /tmp/        { deny all; }
location ^~ /backups/    { deny all; }
location ^~ /.git/       { deny all; }
location =  /.git        { deny all; }

# --- Plugins -----------------------------------------------------------------
# Allow the system_updater process endpoints (consumed by AJAX / SSE / HTTP)
# and deny every other plugin PHP file. The allow block MUST come before the
# deny block, and both MUST come before the generic `location ~ \.php$`.
# Adjust `fastcgi_pass` to match the PHP handler used by your server.
location ~ ^/plugins/system_updater/(process_backup|process_core_update|process_restore|recovery|download_backup)\.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_param SERVER_NAME $host;
    # $https is nginx's built-in ("on" only for TLS) and if_not_empty omits the
    # parameter entirely on plain HTTP. Do NOT switch this to ddev's
    # $fcgi_https: that variable is defined by ddev's own config map and is
    # undefined in a stock nginx, so a production deployment would pass an empty
    # HTTPS and the application would treat TLS requests as insecure.
    fastcgi_param HTTPS $https if_not_empty;
}

location ~ ^/plugins/.+\.php$ {
    deny all;
}
